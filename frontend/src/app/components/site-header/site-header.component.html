<header class="bg-white shadow-sm p-4 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-6 text-base font-bold text-gray-700">
    <a class="flex items-center gap-3 cursor-pointer" routerLink="/home">
      <img src="logo.png" alt="Brilliant Archery Academy Logo" class="h-20 w-20 object-contain rounded-full border border-gray-100" (error)="hideBrokenLogo($event)">
    </a>

    <nav class="flex items-center gap-6 sm:gap-8" id="main-nav">
      <a routerLink="/home" routerLinkActive="text-black font-black text-lg border-b-2 border-black pb-2" [routerLinkActiveOptions]="{ exact: true }" class="hover:text-black text-gray-700 transition-colors pb-2 text-base font-bold px-2">الرئيسية</a>
      <a routerLink="/about" routerLinkActive="text-black font-black text-lg border-b-2 border-black pb-2" class="hover:text-black text-gray-700 transition-colors pb-2 text-base font-bold px-2">من نحن</a>
      <a routerLink="/ranking" routerLinkActive="text-black font-black text-lg border-b-2 border-black pb-2" class="hover:text-black text-gray-700 transition-colors pb-2 text-base font-bold px-2">تصنيف اللاعبين</a>
      <a routerLink="/branches" routerLinkActive="text-black font-black text-lg border-b-2 border-black pb-2" class="hover:text-black text-gray-700 transition-colors pb-2 text-base font-bold px-2">فروعنا</a>
      <a routerLink="/tournaments" routerLinkActive="text-black font-black text-lg border-b-2 border-black pb-2" class="hover:text-black text-gray-700 transition-colors pb-2 text-base font-bold px-2">البطولات</a>
      <a routerLink="/admin" routerLinkActive="text-black font-black text-lg border-b-2 border-black pb-2" class="hover:text-black text-gray-700 transition-colors pb-2 text-base font-bold px-2">لوحة التحكم</a>
      <a *ngIf="authService.isAuthenticated()" routerLink="/admin/users" routerLinkActive="text-black font-black text-lg border-b-2 border-black pb-2" class="hover:text-black text-gray-700 transition-colors pb-2 text-base font-bold px-2">إدارة المشرفين</a>
    </nav>

    <div class="flex items-center gap-5">
      <a href="https://wa.me/201156021211" class="text-[#25D366] hover:opacity-80 transition-opacity" target="_blank" aria-label="WhatsApp" rel="noopener noreferrer">
        <i class="fab fa-whatsapp text-xl"></i>
      </a>
      <a href="https://www.facebook.com/p/Brilliant-Archery-Academy-100063609289580/" class="text-[#1877F2] hover:opacity-80 transition-opacity" target="_blank" aria-label="Facebook" rel="noopener noreferrer">
        <i class="fab fa-facebook text-xl"></i>
      </a>
      <a href="https://www.tiktok.com/@brilliantarcheryacademy" class="text-black hover:text-gray-700 transition-colors" target="_blank" aria-label="TikTok" rel="noopener noreferrer">
        <i class="fab fa-tiktok text-xl"></i>
      </a>
      <a href="https://www.instagram.com/brilliantarchery/" class="text-[#E1306C] hover:opacity-80 transition-opacity" target="_blank" aria-label="Instagram" rel="noopener noreferrer">
        <i class="fab fa-instagram text-xl"></i>
      </a>
      <a href="https://x.com/acadmeyarchery" class="text-black hover:text-gray-700 transition-colors" target="_blank" aria-label="X (Twitter)" rel="noopener noreferrer">
        <i class="fab fa-x-twitter text-xl"></i>
      </a>

      <a *ngIf="!authService.isAuthenticated()" routerLink="/login" class="text-xs font-bold bg-gray-100 text-gray-700 px-3 py-2 rounded-lg hover:bg-gray-200 transition-colors">تسجيل الدخول</a>
      <button *ngIf="authService.isAuthenticated()" type="button" (click)="logout()" class="text-xs font-bold bg-gray-900 text-white px-3 py-2 rounded-lg hover:bg-black transition-colors">تسجيل الخروج</button>
    </div>
  </div>
</header>
