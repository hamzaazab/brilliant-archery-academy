<section class="page-content active max-w-md mx-auto">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <h2 class="text-2xl font-extrabold text-gray-900 text-center mb-2">تسجيل دخول المشرف</h2>
    <p class="text-sm text-gray-500 text-center mb-6">لإدارة صفحة التصنيف والبطولات</p>

    <form (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="text-sm font-semibold text-gray-700">اسم المستخدم</label>
        <input type="text" name="username" [(ngModel)]="username" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="text-sm font-semibold text-gray-700">كلمة المرور</label>
        <input type="password" name="password" [(ngModel)]="password" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <p *ngIf="error" class="text-sm text-red-600">{{ error }}</p>

      <button type="submit" [disabled]="loading" class="w-full bg-gray-900 text-white py-2.5 rounded-lg font-bold hover:bg-black transition-colors disabled:opacity-60">
        {{ loading ? 'جار تسجيل الدخول...' : 'دخول' }}
      </button>
    </form>

    <p class="mt-4 text-xs text-gray-400 text-center">بيانات افتراضية: admin / admin123</p>
  </div>
</section>
